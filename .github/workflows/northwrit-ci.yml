name: NorthWrit CI

on:
  push:
    branches: [main]
    paths: ['apps/northwrit/**', 'scripts/**', 'docs/**', 'README.md', 'AGENTS.md', 'package.json', 'package-lock.json', '.github/workflows/**']
  pull_request:
    paths: ['apps/northwrit/**', 'scripts/**', 'docs/**', 'README.md', 'AGENTS.md', 'package.json', 'package-lock.json', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: northwrit-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: npm run check:repo
      - name: Check changed-commit whitespace
        env:
          WHITESPACE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$WHITESPACE_BASE" || "$WHITESPACE_BASE" =~ ^0+$ ]]; then
            WHITESPACE_BASE=$(git hash-object -t tree /dev/null)
          fi
          npm run check:whitespace -- "$WHITESPACE_BASE" HEAD

  app:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            target: api
          - package: frontend
            target: web
          - package: word-addin
            target: word
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/northwrit/${{ matrix.package }}/package-lock.json
      - run: npm run setup:${{ matrix.target }}
      - run: npm run test:${{ matrix.target }}
      - if: matrix.target == 'web'
        run: npm run lint:web
      - run: npm run typecheck:${{ matrix.target }}
      - if: matrix.target == 'api'
        run: npm run typecheck:api-tests
      - if: matrix.target == 'api'
        run: npm run typecheck:contracts
      - run: npm run build:${{ matrix.target }}
        env:
          SENTRY_DISABLED: 'true'
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          FRONTEND_URL: https://app.northwrit.invalid
          REACT_APP_SENTRY_DISABLED: 'true'
          REACT_APP_WEB_APP_URL: https://app.northwrit.invalid
          WORD_ADDIN_PUBLIC_URL: https://northwrit.invalid
